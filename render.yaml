services:
  - type: web
    name: subtitle-studio
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /health
    envVars:
      - fromGroup: subtitle-studio-online

  - type: worker
    name: subtitle-studio-worker
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerCommand: python scripts/online_worker.py
    preDeployCommand: python scripts/online_store.py
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: subtitle-studio-online
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
